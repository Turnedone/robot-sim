name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux / GCC",     os: ubuntu-24.04, compiler: gcc,   werror: "ON" }
          - { name: "Linux / Clang",   os: ubuntu-24.04, compiler: clang, werror: "ON" }
          - { name: "Windows / MSVC",  os: windows-2022, compiler: msvc,  werror: "OFF" }
    steps:
      - uses: actions/checkout@v5

      - name: Install the viewer's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure (GCC)
        if: matrix.compiler == 'gcc'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DROBOT_SIM_WERROR=${{ matrix.werror }}

      - name: Configure (Clang)
        if: matrix.compiler == 'clang'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DROBOT_SIM_WERROR=${{ matrix.werror }}

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build -DROBOT_SIM_WERROR=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DROBOT_SIM_SANITIZE=ON -DROBOT_SIM_BUILD_VIEWER=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel 4

  static-analysis:
    name: Formatting and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the pinned clang-format and clang-tidy
        run: pip install clang-format==23.1.3 clang-tidy==23.1.3
      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp $(find ros2 -name "*.cpp" -o -name "*.hpp")
      - name: Configure (for compile_commands.json)
        run: cmake -S . -B build -DROBOT_SIM_BUILD_VIEWER=OFF
      - name: clang-tidy
        # main.cpp and viewer.cpp belong to the viewer, which needs a display library.
        run: clang-tidy -p build --quiet $(ls src/*.cpp tests/*.cpp | grep -v -e viewer.cpp -e main.cpp)

  ros2:
    name: ROS 2 Jazzy (colcon build + test)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies with rosdep
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2 --ignore-src -y --rosdistro jazzy \
            --dependency-types build --dependency-types buildtool --dependency-types test
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2 --event-handlers console_cohesion+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths ros2 --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose
